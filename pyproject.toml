[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socaity"
version = "0.2.15"
description = "Python SDK for the socaity.ai catalog: run, run_agent, run_workflow."
requires-python = ">=3.8"
authors = [
    { name = "SocAIty" }
]
license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
    "tqdm",
    "httpx",
    "fastsdk>=0.4.21",
    "apipod-registry>=0.1.9",
    "socaity-schemas>=0.1.9",
    "socaity-cli>=0.1.10",
    "media-toolkit>=00.02.22"
]

[project.optional-dependencies]
apipod = [
    "apipod>=1.0.29",
]
dev = [
    "pytest",
]

[project.urls]
Repository = "https://github.com/SocAIty/socaity"
Homepage = "https://www.socaity.ai"

# The `socaity` console script is provided by the socaity-cli dependency.

[tool.pytest.ini_options]
testpaths = ["test"]
# Resolve sibling packages in local dev (CI installs from pip).
pythonpath = [".", "../socaity-cli", "../socaity-schemas", "../fastsdk", "../APIPodRegistry", "../media-toolkit", "../meseex"]
norecursedirs = ["manual", "stress", "bundle", "output", "test_files"]
markers = [
    "manual: official hosted services (face2face, speechcraft); run the scripts by hand",
    "replicate: platform-mediated Replicate jobs (separate from the core stack)",
]
addopts = ["-m", "not manual"]
