[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socaity"
version = "0.2.1"
description = "Your SDK and model zoo for generative AI. Build AI-powered applications with ease."
requires-python = ">=3.8"
authors = [
    { name = "SocAIty" }
]
license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
    "tqdm",
    "httpx",
    "fastsdk>=0.4.2",
    "apipod-registry>=0.1.1",
    "socaity-schemas>=0.1.1",
    "socaity-cli>=0.1.1",
    "media-toolkit>=00.02.22",
    "singleton_decorator==1.0.0"
]

[project.optional-dependencies]
apipod = [
    "apipod>=1.0.10",
]
dev = [
    "pytest",
]

[project.urls]
Repository = "https://github.com/SocAIty/socaity"
Homepage = "https://www.socaity.ai"

# The `socaity` console script is provided by the socaity-cli dependency.

[tool.pytest.ini_options]
testpaths = ["test"]
# Resolve sibling packages in local dev (CI installs from pip).
pythonpath = [".", "../socaity-cli", "../socaity-schemas", "../fastsdk", "../APIPodRegistry", "../media-toolkit", "../meseex"]
